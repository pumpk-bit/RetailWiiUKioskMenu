# Full redNAND — SLC + SLCCMPT + MLC all on SD
# DeploymentMode = 'FullRedNand'
# Requires minute Format redNAND with MLC. SD must stay inserted while running.
# Retail games on sys MLC are NOT on this red MLC unless you copy them.

[partitions]
slccmpt=true
slc=true
mlc=true

[scfm]
disable=false
allow_sys=true

[disable_encryption]
mlc=false

[sys_mount]
mlc=false
